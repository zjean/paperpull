# PaperPull in Docker.
#
#   browser      a real Google Chrome with a web desktop. You sign in here.
#                Carries its own socat service, supervised by s6, which is the
#                only way out of Chrome's loopback-only DevTools port.
#   paperpull    the control panel and the downloader apps. Its own network
#                identity, so it restarts without touching your session.
#   scheduler    the same image again, running one unattended pass a day for
#                the providers whose sessions last that long. Optional: stop
#                it and nothing else changes.
#
# Nothing is published. Both web UIs go through your reverse proxy — see
# docker/Caddyfile.example. Read docs/docker.md before the first run; the
# design here is dictated by five non-obvious Chrome and Playwright
# behaviours, and the comments below say which is which.
name: paperpull

services:
  browser:
    # linuxserver/chrome plus a socat service — see docker/browser/Dockerfile.
    # The bridge lives inside the browser so its lifecycle is the browser's:
    # `docker compose restart browser` is all there is to remember.
    image: ${PAPERPULL_BROWSER_IMAGE:-ghcr.io/zjean/paperpull-browser:latest}
    # Comment `image` and uncomment this to build it yourself.
    # build: ./docker/browser
    container_name: paperpull-browser
    # Not cosmetic. Chrome records its profile lock as <hostname>-<pid>, and
    # refuses to open a profile locked by a hostname that is not its own —
    # silently, with nothing in any log. A container gets a fresh hostname on
    # every recreate, so without this pin the browser stops starting the second
    # time you bring the stack up. Pinned, Chrome's ordinary stale-PID recovery
    # does the right thing.
    hostname: paperpull-browser
    # Chrome's own sandbox needs this under Docker's default seccomp profile.
    security_opt:
      - seccomp:unconfined
    # Without it Chrome starves on /dev/shm and tabs crash on real sites.
    shm_size: "1gb"
    environment:
      # Who owns the files these containers write. Set PUID/PGID in .env to
      # your own `id -u` / `id -g` and your statements are readable on the host
      # without sudo. The only hard rule is that both containers use the SAME
      # pair — see the note on `user:` below.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Amsterdam}
      # The desktop's own login. Anyone who gets past it reaches a browser
      # that is signed in to your bank, so treat it as a bank password.
      CUSTOM_USER: ${BROWSER_USER:?set BROWSER_USER in .env}
      PASSWORD: ${BROWSER_PASSWORD:?set BROWSER_PASSWORD in .env}
      # --user-data-dir is NOT optional. Chrome 136+ silently refuses remote
      # debugging on the default profile directory — no error, no log line,
      # no DevToolsActivePort, the port simply never opens. linuxserver's
      # wrapper passes a bare valueless --user-data-dir, so ours has to
      # override it. Removing this line breaks everything, quietly.
      #
      # --restore-last-session reopens the tabs after Chrome itself restarts —
      # a crash, or a container recreate. The startup *preference* that keeps
      # session cookies across an exit is set by a recommended policy in the
      # image (see docker/browser/Dockerfile); this is the other half, and the
      # part that survives an unclean exit.
      CHROME_CLI: >-
        --user-data-dir=/config/pp-profile
        --remote-debugging-port=9222
        --remote-allow-origins=*
        --restore-last-session
    volumes:
      # Your signed-in profile. Back this up; losing it means signing in to
      # every provider again. It holds live session cookies — treat it as
      # secret, and never commit it.
      - ./browser-profile:/config
      # Shared with paperpull as its TMPDIR. Playwright's driver creates the
      # download-artifact directory here and tells Chrome to write into it, so
      # both containers must see the same real directory. Without this,
      # download.save_as() reports success and writes a zero-byte file.
      - pw-artifacts:/pwtmp
    networks: [internal, proxy]
    # Compose's default is 10s, which is not enough for s6 to bring the desktop
    # and Chrome down in order. Chrome then dies on SIGKILL with its session
    # unflushed: the profile is marked `exit_type: Crashed`, and the session
    # cookies that hold most of your logins were never written. A stopped
    # container that took four seconds longer costs nothing; signing in to
    # every provider again costs an evening.
    stop_grace_period: 30s
    restart: unless-stopped

  paperpull:
    image: ${PAPERPULL_IMAGE:-ghcr.io/zjean/paperpull:latest}
    # Comment `image` and uncomment this to run your working tree instead.
    # build: .
    container_name: paperpull
    depends_on: [browser]
    # Must be the same pair as the browser's PUID/PGID, which is why both read
    # the same variables. Playwright's driver creates its artifact directory
    # here mode 0700 and Chrome writes the download into it from the other
    # container, so a mismatch means zero-byte PDFs rather than an error.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      # Configs live on the volume below, not in the app directories (which are
      # part of the image). The panel passes an absolute --config, so nothing
      # is written into /app and it can run as any uid.
      PAPERPULL_CONFIG_ROOT: /config
      # The hostname your reverse proxy serves the panel on. Without it every
      # request from that host is refused as cross-origin.
      PAPERPULL_ALLOWED_HOSTS: ${PAPERPULL_ALLOWED_HOSTS:?set PAPERPULL_ALLOWED_HOSTS in .env}
      # Public URL of the browser desktop, for the panel's "Open browser
      # desktop" link. Cosmetic; leave empty to hide the link.
      PAPERPULL_BROWSER_URL: ${PAPERPULL_BROWSER_URL:-}
    volumes:
      # Per-app config.json files. Seeded on first run, then yours.
      - ./config:/config
      # PDFs, the index CSVs, and the delete-safe state (progress.json lives
      # under output_dir, so this one volume makes re-runs safe across
      # rebuilds). Contains your statements — treat as secret.
      - ./data:/data
      - pw-artifacts:/pwtmp
    networks: [internal, proxy]
    restart: unless-stopped

  # Runs the providers whose sessions last for days, and lists the ones that
  # need a person. Same image and same volumes as the panel: it invokes the
  # app CLIs directly, so there is no Docker socket here and nothing new to
  # trust. Stop it and nothing else changes.
  scheduler:
    image: ${PAPERPULL_IMAGE:-ghcr.io/zjean/paperpull:latest}
    container_name: paperpull-scheduler
    # `paperpull` as well as `browser`: the image's entrypoint seeds /config
    # from each app's config.example.json, and that is a check-then-act (does
    # config.json exist? no, write it) which both containers now run. Compose
    # starts services in dependency order, so naming the panel here means its
    # seeding has begun before this one's - and the panel is the container a
    # person interacts with, so it is the one that should win a tie.
    depends_on: [browser, paperpull]
    user: "${PUID:-1000}:${PGID:-1000}"
    # The image's HEALTHCHECK curls the panel's /api/apps. This container
    # serves no HTTP at all, so that check can only ever fail: it would sit
    # permanently `unhealthy` and, under the `restart: unless-stopped` below,
    # any health-keyed monitoring or watchdog would alarm on it or restart it
    # in a loop. Disabled rather than replaced with a heartbeat file, because
    # a process whose whole job is one pass a day has no honest sub-day
    # liveness signal to report, and a heartbeat whose write failed would mark
    # a working scheduler unhealthy - a new failure mode in exchange for a
    # signal nothing consumes. `docker compose logs scheduler` says what it
    # did on each pass, and `tools/due.py` says what is waiting.
    healthcheck:
      disable: true
    # `command`, not `entrypoint`: the image's own entrypoint
    # (docker/entrypoint.sh) is what brings up the socat bridge to the
    # browser's DevTools port and seeds /config, then execs whatever it was
    # given — the same path a one-off `docker compose run --rm paperpull
    # python ...` takes. Overriding it with `entrypoint:` here would skip
    # both, silently, and every app's cdp_url would have nothing to connect
    # to inside this container.
    command: ["python", "/app/tools/schedule.py"]
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      PAPERPULL_CONFIG_ROOT: /config
      # Local hour for the daily pass. Pick one you are usually awake for:
      # a parked account is only actionable by you.
      PAPERPULL_SCHEDULE_HOUR: ${PAPERPULL_SCHEDULE_HOUR:-7}
      # Optional, and off unless you set it. Where to tell a person that a
      # pass parked an account or went wrong - the full topic URL, e.g.
      # https://ntfy.sh/<something-unguessable>. Nothing else in PaperPull
      # makes an outbound call; read the ntfy section of SECURITY.md before
      # you set this, because on ntfy.sh the topic name is the only thing
      # keeping strangers out.
      PAPERPULL_NTFY_URL: ${PAPERPULL_NTFY_URL:-}
      # Only for a topic that requires one - a server of your own, usually.
      PAPERPULL_NTFY_TOKEN: ${PAPERPULL_NTFY_TOKEN:-}
    volumes:
      - ./config:/config
      - ./data:/data
      - pw-artifacts:/pwtmp
    networks: [internal]
    restart: unless-stopped

volumes:
  pw-artifacts:

networks:
  # Just these containers talking to each other.
  internal:
  # Your existing reverse-proxy network. Create it once with:
  #   docker network create proxy
  proxy:
    external: true
